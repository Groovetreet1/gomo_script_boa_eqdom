# Render Blueprint configuration for the GoMobile BOA / EQDOM Streamlit suite.
#
# Deploy with Render "Blueprint" (render.yaml) — creates a Process/Web Service.
# After pushing to GitHub, connect this repo in Render and it auto-provisions.

services:
  - type: web
    name: gomo-tools
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run gomobile.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: poll